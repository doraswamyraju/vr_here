<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR HERE - Business Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RRSMWL2084"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-RRSMWL2084');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Socket.io Client (Self-hosted on vrhere.in to eliminate cdn.socket.io connection timeouts) -->
  <script src="/socket.io.min.js"></script>
  <!-- Start of LetsTrack Live Chat & Tracking -->
  <script>
    (function() {
      var origAttachShadow = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function(init) {
        var shadow = origAttachShadow.call(this, Object.assign({}, init, { mode: 'open' }));
        if (this.id === 'letstrack-widget-root') {
          window.__letsTrackShadowRoot = shadow;
        }
        return shadow;
      };
    })();

    (function() {
      // Sync logged in user profile with LetsTrack
      function syncProfile() {
        try {
          var raw = localStorage.getItem('userInfo');
          if (raw) {
            var user = JSON.parse(raw);
            if (user && typeof user === 'object') {
              if (user.name) localStorage.setItem('letstrack_visitor_name', user.name);
              if (user.email) localStorage.setItem('letstrack_visitor_email', user.email);
              var phone = user.phone || user.phoneNumber || '';
              if (phone) localStorage.setItem('letstrack_visitor_phone', phone);
              return { name: user.name || '', email: user.email || '', phone: phone };
            }
          }
        } catch(e) {}
        return { name: '', email: '', phone: '' };
      }
      
      var profile = syncProfile();
      window.syncLetsTrackProfile = syncProfile;

      window.LetsTrackConfig = {
        websiteId: "lt_6a9347d5410be8335e42db43949caf95", // Tenant API Key from https://livechat.vrhere.in
        visitorName: profile.name,
        visitorEmail: profile.email,
        visitorPhone: profile.phone
      };
    })();

    (function () {
      var d = document, s = d.createElement('script');
      s.src = "https://livechat.vrhere.in/widget.js"; // Pointing to your live VPS subdomain!
      s.async = true;
      d.getElementsByTagName('head')[0].appendChild(s);
    })();
  </script>
  <!-- End of LetsTrack Live Chat & Tracking -->
</body>

</html>

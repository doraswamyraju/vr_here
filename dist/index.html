          var btn = shadow.querySelector('.lt-widget-btn, button, [class*="widget-btn"], [class*="launcher"]');
          var container = shadow.querySelector('.lt-widget-container');
          if (btn) {
            if (visible) {
              btn.style.setProperty('display', 'flex', 'important');
              btn.style.setProperty('visibility', 'visible', 'important');
              btn.style.setProperty('opacity', '1', 'important');
              btn.style.setProperty('pointer-events', 'auto', 'important');
              btn.style.setProperty('position', 'relative', 'important');
              btn.style.setProperty('width', 'auto', 'important');
              btn.style.setProperty('height', 'auto', 'important');
              btn.style.setProperty('z-index', '2147483640', 'important');
            } else {
              btn.style.setProperty('opacity', '0', 'important');
              btn.style.setProperty('pointer-events', 'none', 'important');
              btn.style.setProperty('position', 'absolute', 'important');
              btn.style.setProperty('width', '0px', 'important');
              btn.style.setProperty('height', '0px', 'important');
              btn.style.setProperty('overflow', 'hidden', 'important');
              btn.style.setProperty('margin', '0px', 'important');
              btn.style.setProperty('padding', '0px', 'important');

      var origAttachShadow = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function(init) {
        var shadow = origAttachShadow.call(this, Object.assign({}, init, { mode: 'open' }));
        if (this.id === 'letstrack-widget-root') {
          window.__letsTrackShadowRoot = shadow;
          var applyCustomStyles = function() {

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VR Here Secure Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            color: #1E293B;
            text-align: center;
        }
        .loader {
            border: 4px solid #F1F5F9;
            border-top: 4px solid #DC2626;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            font-weight: 800;
            color: #0F172A;
        }
        p {
            font-size: 13px;
            color: #64748B;
            margin: 0;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 14px;
            background: #FEF2F2;
            color: #DC2626;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid #FECDD3;
        }
        .retry-btn {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            background: #DC2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <h3 id="title">Connecting to Secure Gateway</h3>
    <p id="subtitle">Please wait while we initialize your payment session...</p>
    <div class="badge">256-bit SSL Encrypted • RBI Compliant</div>
    <button class="retry-btn" id="retryBtn" onclick="launchPayment()">Retry Opening Payment</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key') || '';
        const orderId = urlParams.get('order_id') || '';
        const amount = urlParams.get('amount') || '0';
        const currency = urlParams.get('currency') || 'INR';
        const name = urlParams.get('name') || '';
        const email = urlParams.get('email') || '';
        const contact = urlParams.get('contact') || '';
        const serviceName = urlParams.get('service') || 'VR HERE Compliance Service';
        const packageName = urlParams.get('package') || 'Standard Plan';

        function log(msg) {
            console.log('[VRHereCheckout]', msg);
            if (window.AndroidInterface && window.AndroidInterface.logJs) {
                window.AndroidInterface.logJs(msg);
            }
        }

        let rzpInstance = null;

        function launchPayment() {
            if (!window.Razorpay) {
                log('Razorpay script not yet available, retrying in 300ms...');
                setTimeout(launchPayment, 300);
                return;
            }

            log('Initializing Razorpay Checkout with order: ' + orderId);
            
            try {
                const options = {
                    "key": key,
                    "amount": amount,
                    "currency": currency,
                    "name": "VR HERE",
                    "description": serviceName + " - " + packageName,
                    "order_id": orderId,
                    "prefill": {
                        "name": name,
                        "email": email,
                        "contact": contact
                    },
                    "theme": {
                        "color": "#DC2626"
                    },
                    "handler": function (response) {
                        log('Payment Successful: ' + response.razorpay_payment_id);
                        document.getElementById('title').innerText = "Payment Successful!";
                        document.getElementById('subtitle').innerText = "Registering transaction...";
                        if (window.AndroidInterface && window.AndroidInterface.onPaymentSuccess) {
                            window.AndroidInterface.onPaymentSuccess(
                                response.razorpay_payment_id || '',
                                response.razorpay_order_id || orderId,
                                response.razorpay_signature || ''
                            );
                        }
                    },
                    "modal": {
                        "ondismiss": function() {
                            log('Checkout dismissed by user');
                            document.getElementById('title').innerText = "Payment Window Closed";
                            document.getElementById('subtitle').innerText = "You can tap retry or go back.";
                            document.getElementById('retryBtn').style.display = 'inline-block';
                            if (window.AndroidInterface && window.AndroidInterface.onPaymentCancelled) {
                                window.AndroidInterface.onPaymentCancelled();
                            }
                        }
                    }
                };

                rzpInstance = new Razorpay(options);
                
                rzpInstance.on('payment.failed', function (response) {
                    log('Payment Failed: ' + JSON.stringify(response.error));
                    const errorDesc = (response.error && response.error.description) || 'Payment Failed';
                    document.getElementById('title').innerText = "Payment Failed";
                    document.getElementById('subtitle').innerText = errorDesc;
                    document.getElementById('retryBtn').style.display = 'inline-block';
                    if (window.AndroidInterface && window.AndroidInterface.onPaymentFailure) {
                        window.AndroidInterface.onPaymentFailure(errorDesc);
                    }
                });

                rzpInstance.open();
                log('Razorpay modal open() dispatched');
            } catch (err) {
                log('Exception in launchPayment: ' + err.message);
                document.getElementById('title').innerText = "Gateway Error";
                document.getElementById('subtitle').innerText = err.message;
                document.getElementById('retryBtn').style.display = 'inline-block';
                if (window.AndroidInterface && window.AndroidInterface.onPaymentFailure) {
                    window.AndroidInterface.onPaymentFailure(err.message || 'Error opening Razorpay');
                }
            }
        }

        // Trigger on load
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(launchPayment, 200);
        } else {
            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(launchPayment, 200);
            });
        }
    </script>
</body>
</html>
